name: Weekly Firebase Backup

on:
  schedule:
    - cron: "0 13 * * 0"  # every Sunday at 13:00 UTC (~8am Chicago time)
  workflow_dispatch:        # lets you trigger it manually too, from the Actions tab

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch current data from Firebase
        run: |
          mkdir -p backups
          DATE=$(date +'%Y-%m-%d')
          curl -sf "https://chicago-uwh-attendance-default-rtdb.firebaseio.com/chicago-uwh.json" -o "backups/backup-$DATE.json"

      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly backup $(date +'%Y-%m-%d')"
            git push
          fi
