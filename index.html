<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Chicago UWH</title>

<!-- iOS "Add to Home Screen" support -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Chicago UWH" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0A1B28" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230A1B28'/%3E%3Cpath d='M20 70 Q35 55 50 70 T80 70 T110 70 T140 70 T170 70' fill='none' stroke='%233FC1B0' stroke-width='8' stroke-linecap='round'/%3E%3Cpath d='M20 100 Q35 85 50 100 T80 100 T110 100 T140 100 T170 100' fill='none' stroke='%233FC1B0' stroke-width='8' stroke-linecap='round' opacity='0.55'/%3E%3Cpath d='M20 130 Q35 115 50 130 T80 130 T110 130 T140 130 T170 130' fill='none' stroke='%233FC1B0' stroke-width='8' stroke-linecap='round' opacity='0.3'/%3E%3C/svg%3E" />

<style>
  :root {
    --bg: #0A1B28;
    --surface: #0F2536;
    --surface-hover: #123246;
    --border: #16324A;
    --border-strong: #2A4E68;
    --text: #E7F1F6;
    --text-bright: #F3FAFC;
    --muted: #5B8AA6;
    --muted-2: #9EC4D8;
    --accent: #3FC1B0;
    --accent-hover: #5CD4C4;
    --owed: #F3B9C2;
    --danger-bg: #3A1B22;
    --danger-border: #7A2E3A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    min-height: 100vh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 18px 100px; }
  header { border-bottom: 1px solid var(--border); }
  .header-inner { padding: 28px 0 18px; }
  .eyebrow-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .eyebrow { display: flex; align-items: center; gap: 8px; color: var(--accent); }
  .eyebrow span {
    font-family: 'SF Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.25em;
    text-transform: uppercase; color: var(--muted);
  }
  .synced-note { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  h1 {
    font-size: 34px; font-weight: 800; letter-spacing: 0.005em; color: var(--text-bright);
    margin: 0;
  }
  .fee-row { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .fee-row span.label { color: var(--muted); }
  #feeDisplay, #studentFeeDisplay { font-family: ui-monospace, monospace; color: var(--accent); border-bottom: 1px dashed var(--border-strong); background: none; border-top: none; border-left: none; border-right: none; padding: 0; }
  #feeInput, #studentFeeInput { width: 70px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 4px; padding: 4px 6px; color: var(--accent); font-family: ui-monospace, monospace; }
  .wave { width: 100%; height: 16px; color: var(--border); display: block; }

  nav { margin-top: 18px; }
  .tabs { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 10px; border: 1px solid var(--border); overflow-x: auto; }
  .tab-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 5px;
    padding: 9px 8px; border-radius: 7px; font-size: 13px; font-weight: 600; white-space: nowrap;
    background: none; border: none; color: var(--muted);
  }
  .tab-btn.active { background: var(--surface-hover); color: var(--accent); }

  main { padding-top: 20px; }
  .section { display: none; }
  .section.active { display: block; }

  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  input[type=date], input[type=text], input[type=number] {
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 15px; color: var(--text); font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(63,193,176,0.3); }
  .mono { font-family: ui-monospace, monospace; }
  .muted { color: var(--muted); }

  .list { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 14px; }
  .list-item { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .list-item:last-child { border-bottom: none; }
  .list-item.pressable { width: 100%; text-align: left; border: none; color: var(--text); font: inherit; }

  .check { width: 24px; height: 24px; border-radius: 999px; border: 2px solid var(--border-strong); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check svg { display: none; }
  .check.on svg { display: block; }

  .btn {
    background: var(--accent); color: var(--bg); font-weight: 700; border: none; border-radius: 8px;
    padding: 13px; font-size: 15px; width: 100%; margin-top: 18px;
  }
  .btn:active { background: var(--accent-hover); }
  .btn-outline {
    background: none; border: 1px solid var(--border-strong); color: var(--muted-2);
    border-radius: 8px; padding: 7px 12px; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px; margin-top: 14px;
  }
  .btn-small { background: var(--accent); color: var(--bg); border: none; border-radius: 6px; padding: 7px 12px; font-size: 13px; font-weight: 700; }
  .btn-text-danger { background: none; border: none; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 4px; padding: 4px 0; }

  .add-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .add-row input { flex: 1; }
  .add-row button { background: var(--accent); color: var(--bg); font-weight: 700; border: none; border-radius: 8px; padding: 0 16px; display: flex; align-items: center; gap: 5px; font-size: 14px; }

  .empty { text-align: center; padding: 60px 16px; border: 1px dashed var(--border-strong); border-radius: 10px; color: var(--muted); }
  .empty .t { color: var(--muted-2); font-weight: 600; margin: 8px 0 4px; }

  .balance-total { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .balance-total .amt { font-family: ui-monospace, monospace; font-size: 26px; color: var(--owed); }
  .bal-name { color: var(--text); font-size: 15px; }
  .bal-sub { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; margin-top: 2px; }
  .bal-amt { font-family: ui-monospace, monospace; font-size: 17px; }
  .bal-amt.pos { color: var(--owed); }
  .bal-amt.zero { color: var(--accent); }
  .pay-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px 14px; }
  .pay-row input { width: 100px; }

  .chip { font-size: 12px; background: var(--surface-hover); color: var(--muted-2); border-radius: 999px; padding: 5px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
  .session-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; }
  .session-detail { padding: 0 0 12px; }

  #errorBanner { display: none; background: var(--danger-bg); border: 1px solid var(--danger-border); color: var(--owed); font-size: 13px; border-radius: 8px; padding: 8px 12px; margin-top: 12px; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal-card {
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px;
    padding: 22px; width: 100%; max-width: 320px;
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 17px; color: var(--text-bright); }
  .modal-card p { margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .modal-card input { width: 100%; margin-bottom: 10px; }
  .modal-error { color: var(--owed); font-size: 12px; min-height: 16px; margin: -4px 0 8px; }
  .modal-actions { display: flex; gap: 8px; }
  .modal-actions .btn { margin-top: 0; width: auto; flex: 1; }
  .modal-actions .btn-cancel {
    background: none; border: 1px solid var(--border-strong); color: var(--muted-2);
    border-radius: 8px; padding: 13px; font-size: 15px; flex: 1;
  }
  .lock-icon { display: inline-flex; vertical-align: -2px; margin-right: 4px; }

  svg.icon { width: 15px; height: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-inner">
      <div class="eyebrow-row">
        <div class="eyebrow">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 12c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0"/><path d="M2 18c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0"/></svg>
          <span>Attendance &amp; Dues</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <button id="adminToggle" style="background:none;border:none;color:var(--muted);font-size:11px;display:flex;align-items:center;gap:4px;padding:0;text-decoration:underline;text-decoration-style:dashed"></button>
          <div class="synced-note" id="syncNote">Connecting…</div>
        </div>
      </div>
      <div class="title-row">
        <h1 id="titleEl"></h1>
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <div class="fee-row">
            <span class="label">Fee / session</span>
            <button id="feeDisplay"></button>
            <input id="feeInput" type="number" step="0.5" min="0" style="display:none" />
          </div>
          <div class="fee-row">
            <span class="label">Student fee</span>
            <button id="studentFeeDisplay"></button>
            <input id="studentFeeInput" type="number" step="0.5" min="0" style="display:none" />
          </div>
        </div>
      </div>
    </div>
    <svg class="wave" viewBox="0 0 400 16" preserveAspectRatio="none"><path d="M0 8 Q 12.5 0, 25 8 T 50 8 T 75 8 T 100 8 T 125 8 T 150 8 T 175 8 T 200 8 T 225 8 T 250 8 T 275 8 T 300 8 T 325 8 T 350 8 T 375 8 T 400 8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </header>

  <div id="errorBanner"></div>

  <div class="modal-backdrop" id="unlockModal">
    <div class="modal-card">
      <h3>Enter club passcode</h3>
      <p>Needed for payments, roster edits, fees, and exports.</p>
      <input type="password" id="passcodeInput" placeholder="Passcode" autocomplete="off" />
      <div class="modal-error" id="passcodeError"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="passcodeCancel">Cancel</button>
        <button class="btn" id="passcodeSubmit">Unlock</button>
      </div>
    </div>
  </div>

  <nav>
    <div class="tabs">
      <button class="tab-btn" data-tab="practice">Today</button>
      <button class="tab-btn" data-tab="balances">Balances</button>
      <button class="tab-btn" data-tab="roster">Roster</button>
      <button class="tab-btn" data-tab="history">History</button>
    </div>
  </nav>

  <main>
    <section id="practice" class="section"></section>
    <section id="balances" class="section"></section>
    <section id="roster" class="section"></section>
    <section id="history" class="section"></section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
const STORAGE_KEY = "uhc-attendance-v1";
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => new Date().toISOString().slice(0, 10);
const money = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const defaultState = {
  clubName: "Chicago UWH",
  fee: 5,
  studentFee: 3,
  roster: [],
  sessions: [],
  payments: [],
  charges: [],
};

const firebaseConfig = {
  apiKey: "AIzaSyAGt8iFsrESVBcHKjR7atXwldslCk6WIh8",
  authDomain: "chicago-uwh-attendance.firebaseapp.com",
  databaseURL: "https://chicago-uwh-attendance-default-rtdb.firebaseio.com/",
  projectId: "chicago-uwh-attendance",
  storageBucket: "chicago-uwh-attendance.firebasestorage.app",
  messagingSenderId: "978542789457",
  appId: "1:978542789457:web:9914e719079a84e42f8970"
};
firebase.initializeApp(firebaseConfig);
const dbRef = firebase.database().ref("chicago-uwh");

let data = { ...defaultState };
let tab = "practice";
let openSessionId = null;
let payingForId = null;
let chargingForId = null;
let connected = false;
let suppressNextRemoteRender = false;

function save() {
  suppressNextRemoteRender = true;
  dbRef.set(data)
    .then(() => { document.getElementById("errorBanner").style.display = "none"; })
    .catch(() => {
      const b = document.getElementById("errorBanner");
      b.textContent = "Couldn't sync — check your connection. Your last change may not have saved for others.";
      b.style.display = "block";
    });
}

dbRef.on("value", (snapshot) => {
  connected = true;
  document.getElementById("syncNote").textContent = "Synced live";
  if (suppressNextRemoteRender) { suppressNextRemoteRender = false; return; }
  const val = snapshot.val();
  data = val ? { ...defaultState, ...val } : { ...defaultState };
  renderAll();
});

dbRef.once("value").catch(() => {
  const b = document.getElementById("errorBanner");
  b.textContent = "Couldn't connect to the shared database. Check your internet connection and try reloading.";
  b.style.display = "block";
});

// ---------- Passcode gate ----------
// EDIT THIS before deploying — pick your own club passcode. This is a soft
// UI gate, not real security (see conversation notes), but keeps casual
// mistakes and snooping out.
const PASSCODE = "snorkel1";
const UNLOCK_KEY = "uhc-unlocked-v1";
let isUnlocked = localStorage.getItem(UNLOCK_KEY) === "1";
let pendingUnlockAction = null;

function requireUnlock(action) {
  if (isUnlocked) { action(); return; }
  pendingUnlockAction = action;
  document.getElementById("passcodeError").textContent = "";
  document.getElementById("passcodeInput").value = "";
  document.getElementById("unlockModal").classList.add("open");
  document.getElementById("passcodeInput").focus();
}

function closeUnlockModal() {
  document.getElementById("unlockModal").classList.remove("open");
  pendingUnlockAction = null;
}

function submitPasscode() {
  const val = document.getElementById("passcodeInput").value;
  if (val === PASSCODE) {
    isUnlocked = true;
    localStorage.setItem(UNLOCK_KEY, "1");
    const action = pendingUnlockAction;
    closeUnlockModal();
    if (action) action();
    renderAll();
  } else {
    document.getElementById("passcodeError").textContent = "Incorrect passcode.";
  }
}

document.getElementById("passcodeSubmit").addEventListener("click", submitPasscode);
document.getElementById("passcodeCancel").addEventListener("click", closeUnlockModal);
document.getElementById("passcodeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") submitPasscode(); });
document.getElementById("unlockModal").addEventListener("click", (e) => { if (e.target.id === "unlockModal") closeUnlockModal(); });

function downloadCSV(filename, rows) {
  const escCsv = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = rows.map((r) => r.map(escCsv).join(",")).join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function computeBalances() {
  const map = {};
  const currentYear = new Date().getFullYear();
  data.roster.forEach((p) => { map[p.id] = { id: p.id, name: p.name, isStudent: !!p.isStudent, sessionsAttended: 0, sessionsThisYear: 0, sessionsOwed: 0, chargesOwed: 0, owed: 0, paid: 0 }; });
  data.sessions.forEach((s) => {
    const inCurrentYear = typeof s.date === "string" && s.date.slice(0, 4) === String(currentYear);
    s.attendeeIds.forEach((pid) => {
      const person = map[pid];
      if (person) {
        const rate = person.isStudent && s.studentFee != null ? s.studentFee : s.fee;
        person.sessionsAttended += 1;
        person.sessionsOwed += rate;
        person.owed += rate;
        if (inCurrentYear) person.sessionsThisYear += 1;
      }
    });
  });
  (data.charges || []).forEach((c) => {
    if (map[c.personId]) { map[c.personId].chargesOwed += c.amount; map[c.personId].owed += c.amount; }
  });
  data.payments.forEach((pay) => { if (map[pay.personId]) map[pay.personId].paid += pay.amount; });
  return Object.values(map).map((p) => ({ ...p, balance: p.owed - p.paid }));
}

// ---------- Header ----------
function renderHeader() {
  document.getElementById("titleEl").textContent = data.clubName;
  const feeDisp = document.getElementById("feeDisplay");
  const studentFeeDisp = document.getElementById("studentFeeDisplay");
  feeDisp.textContent = money(data.fee);
  studentFeeDisp.textContent = money(data.studentFee);
  feeDisp.disabled = !isUnlocked;
  studentFeeDisp.disabled = !isUnlocked;
  feeDisp.style.cursor = isUnlocked ? "pointer" : "default";
  studentFeeDisp.style.cursor = isUnlocked ? "pointer" : "default";
  feeDisp.style.borderBottomColor = isUnlocked ? "" : "transparent";
  studentFeeDisp.style.borderBottomColor = isUnlocked ? "" : "transparent";
  document.getElementById("adminToggle").textContent = isUnlocked ? "Admin unlocked · Lock" : "Unlock admin features";
}

document.getElementById("adminToggle").addEventListener("click", () => {
  if (isUnlocked) {
    isUnlocked = false;
    localStorage.removeItem(UNLOCK_KEY);
    renderAll();
  } else {
    requireUnlock(() => {});
  }
});

document.getElementById("feeDisplay").addEventListener("click", () => {
  requireUnlock(() => {
    const input = document.getElementById("feeInput");
    const disp = document.getElementById("feeDisplay");
    input.value = data.fee;
    disp.style.display = "none";
    input.style.display = "block";
    input.focus();
    input.select();
  });
});
function commitFee() {
  const input = document.getElementById("feeInput");
  const disp = document.getElementById("feeDisplay");
  const v = parseFloat(input.value);
  if (!isNaN(v) && v >= 0) { data.fee = v; save(); }
  input.style.display = "none";
  disp.style.display = "block";
  renderHeader();
}
document.getElementById("feeInput").addEventListener("blur", commitFee);
document.getElementById("feeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") commitFee(); });

document.getElementById("studentFeeDisplay").addEventListener("click", () => {
  requireUnlock(() => {
    const input = document.getElementById("studentFeeInput");
    const disp = document.getElementById("studentFeeDisplay");
    input.value = data.studentFee;
    disp.style.display = "none";
    input.style.display = "block";
    input.focus();
    input.select();
  });
});
function commitStudentFee() {
  const input = document.getElementById("studentFeeInput");
  const disp = document.getElementById("studentFeeDisplay");
  const v = parseFloat(input.value);
  if (!isNaN(v) && v >= 0) { data.studentFee = v; save(); }
  input.style.display = "none";
  disp.style.display = "block";
  renderHeader();
}
document.getElementById("studentFeeInput").addEventListener("blur", commitStudentFee);
document.getElementById("studentFeeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") commitStudentFee(); });

// ---------- Tabs ----------
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => { tab = btn.dataset.tab; renderAll(); });
});

function emptyState(title, body) {
  return `<div class="empty">
    <svg class="icon" style="width:28px;height:28px;color:var(--border-strong)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0"/><path d="M2 18c1.5-1.5 3-1.5 4.5 0s3 1.5 4.5 0 3-1.5 4.5 0 3 1.5 4.5 0"/></svg>
    <div class="t">${esc(title)}</div>
    <div>${esc(body)}</div>
  </div>`;
}

// ---------- Practice tab ----------
let practiceDate = todayISO();
let checkedIds = new Set();

function initPracticeChecks() {
  const existing = data.sessions.find((s) => s.date === practiceDate);
  checkedIds = new Set(existing ? existing.attendeeIds : []);
}
initPracticeChecks();

function renderPractice() {
  const el = document.getElementById("practice");
  if (data.roster.length === 0) {
    el.innerHTML = emptyState("No one on the roster yet", "Add club members in the Roster tab before marking attendance.");
    return;
  }
  const existing = data.sessions.find((s) => s.date === practiceDate);
  el.innerHTML = `
    <div class="row-between" style="margin-bottom:14px">
      <input type="date" id="dateInput" value="${practiceDate}" />
      <span class="mono muted" style="font-size:12px">${checkedIds.size} of ${data.roster.length} present · ${money(checkedIds.size * data.fee)}</span>
    </div>
    <div class="list">
      ${data.roster.map((p) => `
        <button class="list-item pressable" data-toggle="${p.id}">
          <span>${esc(p.name)}</span>
          <span class="check ${checkedIds.has(p.id) ? "on" : ""}">
            <svg viewBox="0 0 24 24" fill="none" stroke="#0A1B28" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
          </span>
        </button>
      `).join("")}
    </div>
    <button class="btn" id="saveAttendance">${existing ? "Update attendance" : "Save attendance"}</button>
  `;
  document.getElementById("dateInput").addEventListener("change", (e) => {
    practiceDate = e.target.value;
    initPracticeChecks();
    renderPractice();
  });
  el.querySelectorAll("[data-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.toggle;
      checkedIds.has(id) ? checkedIds.delete(id) : checkedIds.add(id);
      renderPractice();
    });
  });
  document.getElementById("saveAttendance").addEventListener("click", () => {
    const attendeeIds = Array.from(checkedIds);
    const idx = data.sessions.findIndex((s) => s.date === practiceDate);
    if (idx >= 0) data.sessions[idx].attendeeIds = attendeeIds;
    else data.sessions.push({ id: uid(), date: practiceDate, fee: data.fee, studentFee: data.studentFee, attendeeIds });
    save();
    renderPractice();
    renderBalances();
    renderHistory();
  });
}

// ---------- Roster tab ----------
function renderRoster() {
  const el = document.getElementById("roster");
  el.innerHTML = `
    <div class="add-row">
      <input type="text" id="nameToAdd" placeholder="Add a member's name" />
      <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted-2);white-space:nowrap">
        <input type="checkbox" id="studentToAdd" style="width:16px;height:16px" /> Student
      </label>
      <button id="addPersonBtn">+ Add</button>
    </div>
    <div id="rosterList"></div>
    ${isUnlocked ? `
    <div style="margin-top:26px;padding-top:18px;border-top:1px solid var(--border)">
      <div style="font-size:14px;font-weight:600;color:var(--text-bright);margin-bottom:4px">Bulk import past attendance</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
        One practice per line: <span class="mono">YYYY-MM-DD: Name, Name, Name</span>. Names must match the roster (not case-sensitive). Existing dates get merged, not duplicated. Historical sessions use today's fee amounts.
      </div>
      <textarea id="importText" rows="6" placeholder="2026-01-05: Alex, Priya, Matt
2026-01-12: Sam, Matt" style="width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--text);font-family:ui-monospace,monospace;resize:vertical"></textarea>
      <button class="btn-small" id="importBtn" style="margin-top:10px">Import</button>
      <div id="importResult" style="font-size:12px;margin-top:10px;white-space:pre-wrap"></div>
    </div>` : ""}
  `;
  const listEl = document.getElementById("rosterList");
  if (data.roster.length === 0) {
    listEl.innerHTML = emptyState("Roster is empty", "Add your club members above to get started.");
  } else {
    listEl.innerHTML = `<div class="list">${data.roster.map((p) => `
      <div class="list-item">
        <span style="display:flex;align-items:center;gap:8px">
          ${esc(p.name)}
          ${p.isStudent ? '<span class="chip" style="background:var(--surface-hover);color:var(--accent)">Student</span>' : ''}
        </span>
        <span style="display:flex;align-items:center;gap:14px">
          <label style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)">
            <input type="checkbox" data-student="${p.id}" ${p.isStudent ? "checked" : ""} style="width:15px;height:15px" /> Student
          </label>
          <button data-remove="${p.id}" style="background:none;border:none;color:var(--muted);${isUnlocked ? "" : "display:none"}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </span>
      </div>`).join("")}</div>`;
  }
  const addPerson = () => {
    const input = document.getElementById("nameToAdd");
    const isStudent = document.getElementById("studentToAdd").checked;
    const name = input.value.trim();
    if (!name) return;
    data.roster.push({ id: uid(), name, isStudent });
    save();
    initPracticeChecks();
    renderAll();
  };
  document.getElementById("addPersonBtn").addEventListener("click", () => requireUnlock(addPerson));
  document.getElementById("nameToAdd").addEventListener("keydown", (e) => { if (e.key === "Enter") requireUnlock(addPerson); });
  listEl.querySelectorAll("[data-student]").forEach((cb) => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.student;
      const newVal = cb.checked;
      const apply = () => {
        data.roster = data.roster.map((p) => p.id === id ? { ...p, isStudent: newVal } : p);
        save();
        renderRoster();
        renderBalances();
      };
      if (!isUnlocked) { cb.checked = !newVal; requireUnlock(apply); return; }
      apply();
    });
  });
  listEl.querySelectorAll("[data-remove]").forEach((btn) => {
    btn.addEventListener("click", () => requireUnlock(() => {
      const id = btn.dataset.remove;
      data.roster = data.roster.filter((p) => p.id !== id);
      data.sessions = data.sessions.map((s) => ({ ...s, attendeeIds: s.attendeeIds.filter((pid) => pid !== id) }));
      data.payments = data.payments.filter((pay) => pay.personId !== id);
      data.charges = data.charges.filter((c) => c.personId !== id);
      save();
      renderAll();
    }));
  });
  const importBtn = document.getElementById("importBtn");
  if (importBtn) importBtn.addEventListener("click", () => {
    const text = document.getElementById("importText").value;
    const resultEl = document.getElementById("importResult");
    const nameMap = {};
    data.roster.forEach((p) => { nameMap[p.name.trim().toLowerCase()] = p.id; });

    const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
    let sessionsCreated = 0, sessionsMerged = 0, attendeesAdded = 0;
    const unmatched = new Set();
    const badLines = [];

    lines.forEach((line) => {
      const colonIdx = line.indexOf(":");
      if (colonIdx === -1) { badLines.push(line); return; }
      const datePart = line.slice(0, colonIdx).trim();
      const namesPart = line.slice(colonIdx + 1);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(datePart)) { badLines.push(line); return; }
      const names = namesPart.split(",").map((n) => n.trim()).filter(Boolean);
      const ids = [];
      names.forEach((n) => {
        const id = nameMap[n.toLowerCase()];
        if (id) ids.push(id); else unmatched.add(n);
      });
      if (ids.length === 0 && names.length > 0) return;

      const existing = data.sessions.find((s) => s.date === datePart);
      if (existing) {
        const before = existing.attendeeIds.length;
        const merged = Array.from(new Set([...existing.attendeeIds, ...ids]));
        attendeesAdded += merged.length - before;
        existing.attendeeIds = merged;
        sessionsMerged += 1;
      } else {
        data.sessions.push({ id: uid(), date: datePart, fee: data.fee, studentFee: data.studentFee, attendeeIds: ids });
        sessionsCreated += 1;
        attendeesAdded += ids.length;
      }
    });

    if (sessionsCreated > 0 || sessionsMerged > 0) { save(); renderHistory(); renderBalances(); }

    const parts = [];
    parts.push(`${sessionsCreated} new session${sessionsCreated === 1 ? "" : "s"} created, ${sessionsMerged} existing date${sessionsMerged === 1 ? "" : "s"} updated (${attendeesAdded} attendee entries added).`);
    if (unmatched.size > 0) parts.push(`Not found on roster (skipped): ${Array.from(unmatched).join(", ")}`);
    if (badLines.length > 0) parts.push(`Couldn't parse ${badLines.length} line(s) — check the YYYY-MM-DD format: ${badLines.join(" | ")}`);
    resultEl.textContent = parts.join("\n");
    resultEl.style.color = (unmatched.size > 0 || badLines.length > 0) ? "var(--owed)" : "var(--accent)";
  });
}

// ---------- Balances tab ----------
function renderBalances() {
  const el = document.getElementById("balances");
  const balances = computeBalances().sort((a, b) => b.balance - a.balance);
  if (data.roster.length === 0) {
    el.innerHTML = emptyState("No balances yet", "Add members and mark attendance to see who owes what.");
    return;
  }
  const totalOutstanding = balances.reduce((sum, p) => sum + Math.max(p.balance, 0), 0);
  el.innerHTML = `
    <div class="balance-total">
      <span class="muted" style="font-size:14px">Total outstanding</span>
      <span class="amt">${money(totalOutstanding)}</span>
    </div>
    ${isUnlocked ? `
    <button class="btn-outline" id="exportBalancesBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export balances (CSV)
    </button>` : ""}
    <div class="list" style="margin-top:14px">
      ${balances.map((p) => `
        <div>
          <div class="list-item">
            <div>
              <div class="bal-name">${esc(p.name)}${p.isStudent ? ' <span class="chip" style="background:var(--surface-hover);color:var(--accent)">Student</span>' : ''}</div>
              <div class="bal-sub">${p.sessionsAttended} session${p.sessionsAttended === 1 ? "" : "s"} · sessions ${money(p.sessionsOwed)}${p.chargesOwed ? " · other charges " + money(p.chargesOwed) : ""} · paid ${money(p.paid)}</div>
              <div class="bal-sub" style="margin-top:2px;color:var(--muted-2)">${p.sessionsThisYear} practice${p.sessionsThisYear === 1 ? "" : "s"} attended in ${new Date().getFullYear()}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
              <span class="bal-amt ${p.balance > 0 ? "pos" : "zero"}">${money(p.balance)}</span>
              ${isUnlocked ? `
              <button class="btn-small" data-charge="${p.id}" style="background:none;border:1px solid var(--border-strong);color:var(--muted-2)">Add charge</button>
              <button class="btn-small" data-pay="${p.id}" style="background:none;border:1px solid var(--border-strong);color:var(--muted-2)">Record payment</button>` : ""}
            </div>
          </div>
          ${payingForId === p.id ? `
            <div class="pay-row">
              <input type="number" step="0.01" min="0" id="payAmount" placeholder="Amount" value="${document.getElementById("payAmount") ? document.getElementById("payAmount").value : (p.balance > 0 ? p.balance.toFixed(2) : "")}" />
              <button class="btn-small" id="savePayBtn">Save</button>
              <button id="cancelPayBtn" style="background:none;border:none;color:var(--muted)">✕</button>
            </div>` : ""}
          ${chargingForId === p.id ? `
            <div class="pay-row">
              <input type="text" id="chargeDesc" placeholder="e.g. Regionals tournament" style="flex:1" value="${document.getElementById("chargeDesc") ? document.getElementById("chargeDesc").value : ""}" />
              <input type="number" step="0.01" min="0" id="chargeAmount" placeholder="Amount" style="width:90px" value="${document.getElementById("chargeAmount") ? document.getElementById("chargeAmount").value : ""}" />
              <button class="btn-small" id="saveChargeBtn">Save</button>
              <button id="cancelChargeBtn" style="background:none;border:none;color:var(--muted)">✕</button>
            </div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
  const exportBalancesBtn = document.getElementById("exportBalancesBtn");
  if (exportBalancesBtn) exportBalancesBtn.addEventListener("click", () => {
    const rows = [["Name", "Student", "Sessions Attended", `Sessions Attended (${new Date().getFullYear()})`, "Sessions Owed", "Other Charges", "Total Paid", "Balance"],
      ...balances.map((p) => [p.name, p.isStudent ? "Yes" : "No", p.sessionsAttended, p.sessionsThisYear, p.sessionsOwed.toFixed(2), p.chargesOwed.toFixed(2), p.paid.toFixed(2), p.balance.toFixed(2)])];
    downloadCSV(`dues-balances-${todayISO()}.csv`, rows);
  });
  el.querySelectorAll("[data-pay]").forEach((btn) => {
    btn.addEventListener("click", () => requireUnlock(() => {
      chargingForId = null;
      payingForId = payingForId === btn.dataset.pay ? null : btn.dataset.pay;
      renderBalances();
      if (payingForId) document.getElementById("payAmount").focus();
    }));
  });
  el.querySelectorAll("[data-charge]").forEach((btn) => {
    btn.addEventListener("click", () => requireUnlock(() => {
      payingForId = null;
      chargingForId = chargingForId === btn.dataset.charge ? null : btn.dataset.charge;
      renderBalances();
      if (chargingForId) document.getElementById("chargeDesc").focus();
    }));
  });
  const cancelBtn = document.getElementById("cancelPayBtn");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { payingForId = null; renderBalances(); });
  const saveBtn = document.getElementById("savePayBtn");
  if (saveBtn) saveBtn.addEventListener("click", () => {
    const v = parseFloat(document.getElementById("payAmount").value);
    if (!v || v <= 0) return;
    data.payments.push({ id: uid(), personId: payingForId, amount: v, date: todayISO() });
    payingForId = null;
    save();
    renderBalances();
  });
  const cancelChargeBtn = document.getElementById("cancelChargeBtn");
  if (cancelChargeBtn) cancelChargeBtn.addEventListener("click", () => { chargingForId = null; renderBalances(); });
  const saveChargeBtn = document.getElementById("saveChargeBtn");
  if (saveChargeBtn) saveChargeBtn.addEventListener("click", () => {
    const desc = document.getElementById("chargeDesc").value.trim();
    const v = parseFloat(document.getElementById("chargeAmount").value);
    if (!v || v <= 0) return;
    data.charges = data.charges || [];
    data.charges.push({ id: uid(), personId: chargingForId, description: desc || "Other charge", amount: v, date: todayISO() });
    chargingForId = null;
    save();
    renderBalances();
  });
}

// ---------- History tab ----------
function renderHistory() {
  const el = document.getElementById("history");
  const sessions = [...data.sessions].sort((a, b) => (a.date < b.date ? 1 : -1));
  const nameFor = (id) => (data.roster.find((p) => p.id === id) || {}).name || "(removed)";
  if (sessions.length === 0) {
    el.innerHTML = emptyState("No practices logged yet", "Sessions you save from the Today tab will show up here.");
    return;
  }
  el.innerHTML = `
    ${isUnlocked ? `
    <button class="btn-outline" id="exportSessionsBtn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export session log (CSV)
    </button>` : ""}
    <div class="list" style="margin-top:14px">
      ${sessions.map((s) => `
        <div>
          <button class="session-header pressable" data-open="${s.id}" style="width:100%;background:none;border:none;color:inherit">
            <span class="mono" style="font-size:14px;display:flex;align-items:center;gap:6px">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2">${openSessionId === s.id ? '<polyline points="6 9 12 15 18 9"/>' : '<polyline points="9 18 15 12 9 6"/>'}</svg>
              ${s.date}
            </span>
            <span class="mono muted" style="font-size:12px">${s.attendeeIds.length} present · ${money(s.attendeeIds.length * s.fee)}</span>
          </button>
          ${openSessionId === s.id ? `
            <div class="session-detail">
              <div class="chips">
                ${s.attendeeIds.length === 0 ? `<span class="muted" style="font-size:12px">No one marked present</span>` : s.attendeeIds.map((pid) => `<span class="chip">${esc(nameFor(pid))}</span>`).join("")}
              </div>
              ${isUnlocked ? `
              <div style="padding:0 16px 12px">
                <button class="btn-text-danger" data-delete="${s.id}">
                  <svg class="icon" style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                  Delete this session
                </button>
              </div>` : ""}
            </div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
  const exportSessionsBtn = document.getElementById("exportSessionsBtn");
  if (exportSessionsBtn) exportSessionsBtn.addEventListener("click", () => {
    const rows = [["Date", "Fee", "Attendee Count", "Total Collected", "Attendees"],
      ...sessions.map((s) => [s.date, s.fee.toFixed(2), s.attendeeIds.length, (s.attendeeIds.length * s.fee).toFixed(2), s.attendeeIds.map(nameFor).join("; ")])];
    downloadCSV(`session-log-${todayISO()}.csv`, rows);
  });
  el.querySelectorAll("[data-open]").forEach((btn) => {
    btn.addEventListener("click", () => {
      openSessionId = openSessionId === btn.dataset.open ? null : btn.dataset.open;
      renderHistory();
    });
  });
  el.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", () => requireUnlock(() => {
      data.sessions = data.sessions.filter((s) => s.id !== btn.dataset.delete);
      openSessionId = null;
      save();
      renderHistory();
      renderBalances();
    }));
  });
}

// ---------- Main render ----------
function renderAll() {
  document.querySelectorAll(".tab-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll(".section").forEach((s) => s.classList.toggle("active", s.id === tab));
  renderHeader();
  renderPractice();
  renderRoster();
  renderBalances();
  renderHistory();
}

renderAll();
</script>
</body>
</html>
